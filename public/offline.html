<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#02020A" />
    <title>Kova — Offline</title>
    <style>
      html, body { height: 100%; margin: 0; background: #02020A; color: #fff;
        font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
      .logo { width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #2563EB, #6366F1); font-size: 40px; font-weight: 900; margin-bottom: 24px;
        box-shadow: 0 12px 40px rgba(37,99,235,0.35); }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; }
      p { color: rgba(255,255,255,0.6); font-size: 14px; max-width: 320px; line-height: 1.5; margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">V</div>
      <h1>You're offline</h1>
      <p>Visi will reconnect when you're back online.</p>
    </div>
  </body>
</html>
